name: Gallery

on:
  pull_request:
    paths: ["gallery/themes/**", "gallery/prompts/**"]
  push:
    branches: [main]
    paths: ["gallery/themes/**", "gallery/prompts/**"]

permissions:
  contents: write

jobs:
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check submitted themes
        if: github.event_name == 'pull_request'
        run: node scripts/build-gallery.mjs --check

      - name: Rebuild gallery/index.json
        if: github.event_name == 'push'
        run: |
          node scripts/build-gallery.mjs
          if ! git diff --quiet gallery/index.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gallery/index.json
            git commit -m "Rebuild gallery index"
            git push
          fi
